name: Bug Report
description: Share reproducible problems so we can fix them quickly.
labels: [bug]
title: "[Bug] <short summary>"
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to report an issue! Please fill out the fields below as completely as possible.

              Found a security problem? Please don't report it here; use **Report a vulnerability** in the **Security** tab (see [SECURITY.md](https://github.com/hrobasti/timberella-plugin/security/policy)).
    - type: input
      id: server_version
      attributes:
          label: Server Version
          description: "Include the full Paper version string"
          placeholder: "Paper 26.3 build 49"
      validations:
          required: true
    - type: textarea
      id: plugin_version
      attributes:
          label: Timberella Version
          description: Which Timberella build are you running? If built from source, mention the commit hash.
          placeholder: "2.0.0 (or the commit hash if built from source)"
      validations:
          required: true
    - type: textarea
      id: description
      attributes:
          label: What happened?
          description: Describe the bug and what you expected instead.
          placeholder: Clear and concise description.
      validations:
          required: true
    - type: textarea
      id: reproduction
      attributes:
          label: Steps to Reproduce
          description: Provide a numbered list of steps that reliably reproduces the issue.
          placeholder: |
              1. Enable timber...
              2. Chop a mangrove...
              3. Observe ...
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: Relevant Log Output
          description: Paste any stack traces or relevant console output (use code fences).
          render: shell
      validations:
          required: false
    - type: textarea
      id: extra
      attributes:
          label: Additional Context
          description: Add any other context or screenshots that might help.
      validations:
          required: false
