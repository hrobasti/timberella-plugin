version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Paper stays pinned to the oldest stable build of its minor version, so only a new
      # minor version is news. Maven ordering puts -rc-/-pre- versions of 26.4 below 26.4,
      # so this range covers them too. Raise both bounds with every Paper minor bump.
      - dependency-name: "io.papermc.paper:paper-api"
        versions: ["[26.0,26.4)"]
      # Compile-only APIs of other plugins: their repositories (repo.momirealms.net,
      # mvn.lumine.io) refuse Dependabot with 403, and MMOItems/MythicLib are pinned
      # snapshots anyway. Check their versions by hand during audits.
      - dependency-name: "net.momirealms:craft-engine-bukkit"
      - dependency-name: "net.Indyuce:MMOItems-API"
      - dependency-name: "io.lumine:MythicLib-dist"
      - dependency-name: "io.lumine:MythicCrucible-Dist"
      - dependency-name: "io.lumine:Mythic-Dist"
