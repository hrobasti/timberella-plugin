plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.5.1'
}

import org.gradle.jvm.tasks.Jar

group = 'com.github.hrobasti.timberella'

def versionProps = new Properties()
def versionFile = file('version.properties')
if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
}
def resolvedVersion = versionProps.getProperty('version')
if (resolvedVersion == null || resolvedVersion.trim().isEmpty()) {
    resolvedVersion = project.findProperty('version') ?: '1.0-SNAPSHOT'
}
version = resolvedVersion
def paperApiVersion = (project.findProperty('paperApiVersion') ?: '26.2.build.48-alpha').toString()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:${paperApiVersion}")
    implementation(project(':plugins:turtle-lib'))
    implementation('net.kyori:adventure-text-minimessage:4.17.0')
    implementation('com.google.code.gson:gson:2.10.1')
    testImplementation('org.junit.jupiter:junit-jupiter-api:5.10.2')
    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:5.10.2')
}

def pluginVersionString = project.version.toString()
tasks.named('processResources') {
    inputs.property('version', pluginVersionString)
    filesMatching('paper-plugin.yml') {
        expand([version: pluginVersionString])
    }
}

tasks.named('shadowJar') {
    archiveBaseName.set('timberella-paper')
    archiveClassifier.set('')
    destinationDirectory.set(layout.projectDirectory.dir('dist'))
}

tasks.named('sourcesJar', Jar) {
    archiveBaseName.set('timberella-paper')
    archiveClassifier.set('sources')
    destinationDirectory.set(layout.projectDirectory.dir('dist/sources'))
}

tasks.named('jar') {
    enabled = false // only shadowed timberella-paper artifact
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
    dependsOn tasks.named('sourcesJar')
}

tasks.named('clean') {
    delete layout.projectDirectory.dir('dist')
}

