    upgrade_new_entries: "- リスト <list> に新しいデフォルト項目がありません: <entries>"
    upgrade_replaced_file: "- カスタマイズした <file> は置き換えられました。元のファイルはバックアップにあります。"
    upgrade_dropped_invalid: "- 引き継がれませんでした (値が新しい設定に合いません): <key> = <value>"
    upgrade_removed: "- 削除した設定を引き継ぎました: <key>"
    upgrade_backup_only: "- <file> は新しいバージョンに対応するファイルがないため、バックアップにのみ残ります。"
warn:
    unsupported_server_version:
        "<yellow>警告: Timberella は公式には <gold><required_server></gold> サーバーで動作する Minecraft <gold><supported_versions></gold>
        をサポートしています。現在のサーバーは <gold><server_name></gold> <gold><mc_version></gold> です。自己責任で続行してください。</yellow>"
