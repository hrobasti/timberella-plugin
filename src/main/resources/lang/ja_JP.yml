    version: <prefix> <white>Timberella <gold><current_ver></gold></white>
    player_not_found: <prefix> <red>プレイヤーが見つかりません。</red>
toggle:
    self_enabled: <prefix> <white>Timberella を有効化しました。</white>
    self_disabled: <prefix> <white>Timberella を無効化しました。</white>
    other_enabled: <prefix> <white><gold><player></gold> を有効化しました。</white>
    other_disabled: <prefix> <white><gold><player></gold> を無効化しました。</white>
update:
